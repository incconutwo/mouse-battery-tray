name: Build Windows installer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.15'
          cache: pip

      - name: Install pinned Python dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --requirement requirements-build.txt

      - name: Build standalone application
        shell: pwsh
        run: |
          python build_icon.py
          python -m PyInstaller --noconfirm --clean AttackSharkBatteryTray.spec

      - name: Install verified Inno Setup compiler
        shell: pwsh
        run: |
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe'
          $expected = '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732'
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          $installDir = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          Invoke-WebRequest -Uri $url -OutFile $installer
          $actual = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Inno Setup hash mismatch: $actual" }
          $process = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR=' + $installDir)) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed: $($process.ExitCode)" }
          "ISCC_PATH=$installDir\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build installer
        shell: pwsh
        run: '& $env:ISCC_PATH installer.iss'

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $file = Get-Item release\AttackSharkBatteryTraySetup-1.2.0.exe
          $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash
          "$hash  $($file.Name)" | Set-Content release\SHA256SUMS.txt -Encoding ascii

      - name: Upload unsigned release candidate
        uses: actions/upload-artifact@v4
        with:
          name: AttackSharkBatteryTray-1.2.0-unsigned
          path: |
            release/AttackSharkBatteryTraySetup-1.2.0.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
